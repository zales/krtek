name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3
      - run: ./fetch-sqlite.sh

      - name: build
        run: |
          zig build -Doptimize=ReleaseFast -Dstatic \
            -Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)

      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          ! grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt

      - name: package
        run: ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "macos-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: jirutka/setup-alpine@v1
        with:
          branch: v3.22
          packages: >
            build-base pkgconf python3 curl tar xz
            postgresql-dev mariadb-connector-c-dev
            openssl-dev openssl-libs-static zlib-static
            krb5-dev openldap-dev curl-dev curl-static

      - name: zig
        shell: alpine.sh {0}
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-$arch-linux-0.16.0.tar.xz" -o zig.tar.xz
          mkdir -p /opt/zig && tar xJf zig.tar.xz -C /opt/zig --strip-components=1

      - name: build and package
        shell: alpine.sh {0}
        run: |
          export PATH=/opt/zig:$PATH
          ./fetch-sqlite.sh
          zig build -Doptimize=ReleaseFast -Dstatic
          file zig-out/bin/krtek
          ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          {
            echo "A database manager for the terminal: SQLite, PostgreSQL, MySQL/MariaDB and Redis."
            echo
            echo "Each archive holds one binary and needs **nothing installed**: SQLite, libpq,"
            echo "the MariaDB connector and OpenSSL are linked into it, and Redis is spoken"
            echo "directly."
            echo
            echo "The Linux builds are static against musl - they run on any distribution."
            echo "The macOS builds leave only Apple's own libraries dynamic."
            echo
            echo '```sh'
            echo "tar xzf krtek-*.tar.gz && ./krtek-*/krtek --help"
            echo '```'
          } > notes.md
          gh release create "$version" \
            --title "krtek $version" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256
