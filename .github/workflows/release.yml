name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3
      - run: ./fetch-sqlite.sh

      - name: build
        run: |
          zig build -Doptimize=ReleaseFast -Dstatic \
            -Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)

      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          ! grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt

      - name: package
        run: ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "macos-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpq-dev libmariadb-dev

      - run: ./fetch-sqlite.sh
      - run: zig build -Doptimize=ReleaseFast
      - run: ldd zig-out/bin/krtek
      - run: ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          {
            echo "A database manager for the terminal: SQLite, PostgreSQL, MySQL/MariaDB and Redis."
            echo
            echo "**macOS** needs nothing installed: SQLite, libpq, the MariaDB connector and"
            echo "OpenSSL are linked into the binary, Redis is spoken directly, and only"
            echo "Apple's own libraries are left dynamic."
            echo
            echo "**Linux** links the two client libraries dynamically, because Debian ships a"
            echo "libpq.a that is missing pieces it needs:"
            echo
            echo '```sh'
            echo "apt install libpq5 libmariadb3"
            echo '```'""
            echo
            echo '```sh'
            echo "tar xzf krtek-*.tar.gz && ./krtek-*/krtek --help"
            echo '```'
          } > notes.md
          gh release create "$version" \
            --title "krtek $version" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256
