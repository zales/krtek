name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3
      - run: ./fetch-sqlite.sh

      # -Dcpu=baseline, or Zig builds for the CPU of the runner: GitHub's arm64
      # machines are Neoverse and emit SVE, which is an illegal instruction on
      # Apple silicon, and the x86 ones are no better. A release has to run on
      # everybody's processor, not on the one that compiled it.
      - name: build
        run: |
          zig build -Doptimize=ReleaseFast -Dstatic -Dstrip -Dcpu=baseline \
            -Dversion="${{ inputs.tag || github.ref_name }}" \
            -Dlibpq="$(brew --prefix libpq)" -Dmariadb="$(brew --prefix mariadb-connector-c)"

      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          if grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt; then
            echo "::error::a client library is still a runtime dependency"; exit 1
          fi

      - name: it says which version it is
        run: |
          ./zig-out/bin/krtek --version
          test "$(./zig-out/bin/krtek --version)" = "krtek ${{ inputs.tag || github.ref_name }}"

      - name: package
        run: ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "macos-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: build static, in alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -euc '
            apk add --no-cache build-base cmake pkgconf python3 curl tar xz \
              postgresql-dev openssl-dev openssl-libs-static zlib-static >/dev/null
            curl -fsSL "https://ziglang.org/download/0.16.0/zig-$(uname -m)-linux-0.16.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig && tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            export PATH=/opt/zig:$PATH ZIG_GLOBAL_CACHE_DIR=/tmp/zig-cache
            ./fetch-sqlite.sh
            OPTIMIZE=ReleaseFast ./tests/linux-static.sh -Dstrip -Dcpu=baseline -Dversion=${{ inputs.tag || github.ref_name }}
            ./tests/smoke.sh
          '

      # Static all the way down: this is the whole point of the Alpine detour, and
      # a shared library sneaking back in would not be noticed otherwise.
      - name: it needs nothing at all
        run: |
          file zig-out/bin/krtek | tee links.txt
          grep -q "statically linked" links.txt

      # A check that -Dcpu=baseline is still there, since losing one word would
      # not be noticed until somebody else's machine died on it: run the binary on
      # an emulated processor without what this runner happens to have - qemu64 has
      # no AVX, cortex-a72 no SVE.
      #
      # Behavioural on purpose. Grepping the disassembly for those instructions
      # does not work: OpenSSL carries AVX-512 routines and picks them by CPUID at
      # runtime, which is safe and would fail the grep. Running it is the question
      # actually worth asking.
      - name: it runs on a CPU without the runner's extras
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          case "${{ matrix.arch }}" in
            x86_64) qemu-x86_64 -cpu qemu64 zig-out/bin/krtek --help ;;
            arm64) qemu-aarch64 -cpu cortex-a72 zig-out/bin/krtek --help ;;
            *) echo "::error::no baseline CPU known for ${{ matrix.arch }}"; exit 1 ;;
          esac

      - name: package
        run: |
          sudo chown -R "$(id -u):$(id -g)" zig-out
          ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "linux-${{ matrix.arch }}"

      # A .deb of the same binary, built here rather than in the container: dpkg
      # is on the runner and Alpine has none. It depends on nothing, so it
      # installs on any Debian or Ubuntu.
      - name: deb
        run: |
          arch=${{ matrix.arch }}
          ./packaging/deb.sh "${{ inputs.tag || github.ref_name }}" "${arch/x86_64/amd64}"

      # Installing it is the only proof that matters, and a Debian container is
      # not the machine that built it.
      - name: the deb installs and runs
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 sh -euc '
            dpkg -i krtek_*.deb
            krtek --help | head -1
            test -f /usr/share/man/man1/krtek.1.gz
            dpkg -r krtek
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The formula names the checksums of the archives that were just built, so
      # it can never point at something that is not there.
      - name: the homebrew formula
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          ./packaging/formula.sh "$version" artifacts > artifacts/krtek.rb
          cat artifacts/krtek.rb

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          # A heredoc, because the notes are prose: quoting them through echo is how
          # a backslash ends up in a release nobody can edit afterwards.
          cat > notes.md <<'NOTES'
          A database manager for the terminal: SQLite, PostgreSQL, MySQL/MariaDB,
          Redis and Kafka, behind one interface.

          Every archive holds one binary that **needs nothing installed**. SQLite,
          libpq, the MariaDB connector and OpenSSL are linked into it; Redis and Kafka
          are spoken directly, protocol and all.

          The Linux binaries are static against musl and run on any distribution. The
          macOS ones leave only Apple's own libraries dynamic. Both are built for a
          baseline CPU, so they run on any processor of their architecture.

          ```sh
          brew install zales/krtek/krtek                # macOS and Linux
          sudo apt install krtek                        # Debian, Ubuntu - see below
          tar xzf krtek-*.tar.gz && ./krtek-*/krtek     # anywhere else
          ```

          The APT repository is signed, so apt checks it the way it checks Debian's own:

          ```sh
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSLo /etc/apt/keyrings/krtek.gpg \
            https://zales.github.io/krtek/krtek-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/krtek.gpg] https://zales.github.io/krtek ./" \
            | sudo tee /etc/apt/sources.list.d/krtek.list
          sudo apt update && sudo apt install krtek
          ```
          NOTES
          # The indentation above is the workflow's; strip it from the file.
          sed -i 's/^          //' notes.md
          gh release create "$version" \
            --title "krtek $version" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
            artifacts/*.deb artifacts/*.deb.sha256 \
            artifacts/krtek.rb

      # The tap picks the formula up from this release on its own - see the
      # comment in packaging/formula.sh.

  # And the APT repository on GitHub Pages, from the .deb files the release just
  # attached. Called, not triggered: see the comment at the top of apt.yml.
  apt:
    needs: release
    uses: ./.github/workflows/apt.yml
    secrets: inherit
    permissions:
      contents: write
