name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: client libraries (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libmariadb-dev libssl-dev

      - name: client libraries (macos)
        if: runner.os == 'macOS'
        run: brew install libpq mariadb-connector-c openssl@3

      - name: the SQLite amalgamation
        run: ./fetch-sqlite.sh

      # Static: the client libraries go into the binary, so what is downloaded
      # needs nothing installed to run.
      - name: build
        run: |
          zig build -Doptimize=ReleaseFast -Dstatic \
            ${{ runner.os == 'macOS' && '-Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c) -Dopenssl=$(brew --prefix openssl@3)' || '' }}

      - name: nothing but the system is linked
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L zig-out/bin/krtek | tee links.txt
            ! grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt
          else
            ldd zig-out/bin/krtek | tee links.txt
            ! grep -qE "libpq|mariadb|libssl|libcrypto" links.txt
          fi

      - name: package
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          name="krtek-$version-${{ matrix.target }}"
          mkdir -p "$name"
          cp zig-out/bin/krtek README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          {
            echo "A database manager for the terminal: SQLite, PostgreSQL, MySQL/MariaDB and Redis."
            echo
            echo "Each archive holds one binary and needs **nothing installed**: SQLite, libpq,"
            echo "the MariaDB connector and OpenSSL are linked into it, and Redis is spoken"
            echo "directly. Only the operating system's own libraries are left dynamic."
            echo
            echo '```sh'
            echo "tar xzf krtek-*.tar.gz && ./krtek-*/krtek --help"
            echo '```'
          } > notes.md
          gh release create "$version" \
            --title "krtek $version" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256
