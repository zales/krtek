name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3
      - run: ./fetch-sqlite.sh

      # -Dcpu=baseline, or Zig builds for the CPU of the runner: GitHub's arm64
      # machines are Neoverse and emit SVE, which is an illegal instruction on
      # Apple silicon, and the x86 ones are no better. A release has to run on
      # everybody's processor, not on the one that compiled it.
      - name: build
        run: |
          zig build -Doptimize=ReleaseFast -Dstatic -Dstrip -Dcpu=baseline \
            -Dlibpq="$(brew --prefix libpq)" -Dmariadb="$(brew --prefix mariadb-connector-c)"

      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          if grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt; then
            echo "::error::a client library is still a runtime dependency"; exit 1
          fi

      - name: package
        run: ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "macos-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: build static, in alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -euc '
            apk add --no-cache build-base cmake pkgconf python3 curl tar xz \
              postgresql-dev openssl-dev openssl-libs-static zlib-static >/dev/null
            curl -fsSL "https://ziglang.org/download/0.16.0/zig-$(uname -m)-linux-0.16.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig && tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            export PATH=/opt/zig:$PATH ZIG_GLOBAL_CACHE_DIR=/tmp/zig-cache
            ./fetch-sqlite.sh
            OPTIMIZE=ReleaseFast ./tests/linux-static.sh -Dstrip -Dcpu=baseline
            ./tests/smoke.sh
          '

      # Static all the way down: this is the whole point of the Alpine detour, and
      # a shared library sneaking back in would not be noticed otherwise.
      - name: it needs nothing at all
        run: |
          file zig-out/bin/krtek | tee links.txt
          grep -q "statically linked" links.txt

      # And a check that it worked, because -Dcpu=baseline is one word and losing
      # it would not be noticed until somebody else's machine died on it. SVE is
      # what GitHub's arm64 runners emit; AVX-512 is the x86 equivalent.
      - name: no instructions somebody's CPU might not have
        run: |
          objdump -d zig-out/bin/krtek > dis.txt
          # `! grep ...` would not fail the step unless it were the last line -
          # errexit skips a command whose status is inverted - so ask outright.
          if grep -qE "\b(ptrue|whilelo|cntb)\b" dis.txt; then
            echo "::error::SVE instructions - built for the runner's CPU, not baseline"; exit 1
          fi
          if grep -qE "%zmm|\bvmovdqu64\b" dis.txt; then
            echo "::error::AVX-512 instructions - built for the runner's CPU, not baseline"; exit 1
          fi

      - name: package
        run: |
          sudo chown -R "$(id -u):$(id -g)" zig-out
          ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "linux-${{ matrix.arch }}"

      # A .deb of the same binary, built here rather than in the container: dpkg
      # is on the runner and Alpine has none. It depends on nothing, so it
      # installs on any Debian or Ubuntu.
      - name: deb
        run: |
          arch=${{ matrix.arch }}
          ./packaging/deb.sh "${{ inputs.tag || github.ref_name }}" "${arch/x86_64/amd64}"

      # Installing it is the only proof that matters, and a Debian container is
      # not the machine that built it.
      - name: the deb installs and runs
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 sh -euc '
            dpkg -i krtek_*.deb
            krtek --help | head -1
            test -f /usr/share/man/man1/krtek.1.gz
            dpkg -r krtek
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    # At the job level so the step below can ask whether there is a token at all;
    # the secrets context is not readable from a step's `if`.
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The formula names the checksums of the archives that were just built, so
      # it can never point at something that is not there.
      - name: the homebrew formula
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          ./packaging/formula.sh "$version" artifacts > artifacts/krtek.rb
          cat artifacts/krtek.rb

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          {
            echo "A database manager for the terminal: SQLite, PostgreSQL, MySQL/MariaDB and Redis."
            echo
            echo "Every archive holds one binary that **needs nothing installed**. SQLite,"
            echo "libpq, the MariaDB connector and OpenSSL are linked into it, and Redis is"
            echo "spoken directly."
            echo
            echo "The Linux binaries are static against musl and run on any distribution."
            echo "The macOS ones leave only Apple's own libraries dynamic."
            echo
            echo '```sh'
            echo "brew install zales/krtek/krtek                 # macOS and Linux"
            echo "sudo dpkg -i krtek_*_amd64.deb                 # Debian, Ubuntu"
            echo "tar xzf krtek-*.tar.gz && ./krtek-*/krtek      # anywhere else"
            echo '```'
          } > notes.md
          gh release create "$version" \
            --title "krtek $version" \
            --notes-file notes.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
            artifacts/*.deb artifacts/*.deb.sha256 \
            artifacts/krtek.rb

      # And into the tap, so `brew upgrade` sees it. Needs a token that may push
      # to zales/homebrew-krtek; without one the formula is still on the release
      # above and can be copied over by hand.
      - name: the tap
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/zales/homebrew-krtek.git" tap
          mkdir -p tap/Formula
          cp artifacts/krtek.rb tap/Formula/krtek.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Formula/krtek.rb
          git diff --cached --quiet || git commit -m "krtek $version"
          git push
