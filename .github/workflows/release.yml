name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3 libssh2
      - run: ./fetch-sqlite.sh

      # -Dcpu=baseline, or Zig builds for the CPU of the runner: GitHub's arm64
      # machines are Neoverse and emit SVE, which is an illegal instruction on
      # Apple silicon, and the x86 ones are no better. A release has to run on
      # everybody's processor, not on the one that compiled it.
      #
      # ReleaseSafe rather than ReleaseFast, and the difference is not speed.
      # Half a dozen parsers here read a length off a socket and then believe it:
      # TDS says how long a column is, Kafka how long a record batch is, S3 how
      # long a listing is. With the checks on, a wrong number is a panic that
      # names the line; without them it is a read past the end of a buffer that
      # says nothing. The fuzzer already runs ReleaseSafe, so this is also what
      # makes what is fuzzed and what is shipped the same program.
      #
      # It costs 239 kB of the four megabytes and nothing anybody can feel: this
      # waits on a network and on a keyboard, never on a processor. Keeping the
      # drivers safe while the interface stayed fast was tried first and does not
      # work - a per-module `optimize` sets that module's `builtin.mode` and
      # generates no checks, and `@setRuntimeSafety` does not reach past the
      # function it is written in.
      - name: build
        run: |
          zig build -Doptimize=ReleaseSafe -Dstatic -Dstrip -Dcpu=baseline \
            -Dversion="${{ inputs.tag || github.ref_name }}" \
            -Dlibpq="$(brew --prefix libpq)" -Dmariadb="$(brew --prefix mariadb-connector-c)"

      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          if grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt; then
            echo "::error::a client library is still a runtime dependency"; exit 1
          fi

      - name: it says which version it is
        run: |
          ./zig-out/bin/krtek --version
          test "$(./zig-out/bin/krtek --version)" = "krtek ${{ inputs.tag || github.ref_name }}"

      - name: package
        run: ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "macos-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: build static, in alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -euc '
            apk add --no-cache build-base cmake pkgconf python3 curl tar xz \
              postgresql-dev openssl-dev openssl-libs-static zlib-static \
              libssh2-dev libssh2-static >/dev/null
            curl -fsSL "https://ziglang.org/download/0.16.0/zig-$(uname -m)-linux-0.16.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig && tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            export PATH=/opt/zig:$PATH ZIG_GLOBAL_CACHE_DIR=/tmp/zig-cache
            ./fetch-sqlite.sh
            OPTIMIZE=ReleaseSafe ./tests/linux-static.sh -Dstrip -Dcpu=baseline -Dversion=${{ inputs.tag || github.ref_name }}
            ./tests/smoke.sh
          '

      # Static all the way down: this is the whole point of the Alpine detour, and
      # a shared library sneaking back in would not be noticed otherwise.
      - name: it needs nothing at all
        run: |
          file zig-out/bin/krtek | tee links.txt
          grep -q "statically linked" links.txt

      # A check that -Dcpu=baseline is still there, since losing one word would
      # not be noticed until somebody else's machine died on it: run the binary on
      # an emulated processor without what this runner happens to have - qemu64 has
      # no AVX, cortex-a72 no SVE.
      #
      # Behavioural on purpose. Grepping the disassembly for those instructions
      # does not work: OpenSSL carries AVX-512 routines and picks them by CPUID at
      # runtime, which is safe and would fail the grep. Running it is the question
      # actually worth asking.
      - name: it runs on a CPU without the runner's extras
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          case "${{ matrix.arch }}" in
            x86_64) qemu-x86_64 -cpu qemu64 zig-out/bin/krtek --help ;;
            arm64) qemu-aarch64 -cpu cortex-a72 zig-out/bin/krtek --help ;;
            *) echo "::error::no baseline CPU known for ${{ matrix.arch }}"; exit 1 ;;
          esac

      - name: package
        run: |
          sudo chown -R "$(id -u):$(id -g)" zig-out
          ./tests/package.sh "${{ inputs.tag || github.ref_name }}" "linux-${{ matrix.arch }}"

      # A .deb of the same binary, built here rather than in the container: dpkg
      # is on the runner and Alpine has none. It depends on nothing, so it
      # installs on any Debian or Ubuntu.
      - name: deb
        run: |
          arch=${{ matrix.arch }}
          ./packaging/deb.sh "${{ inputs.tag || github.ref_name }}" "${arch/x86_64/amd64}"

      # Installing it is the only proof that matters, and a Debian container is
      # not the machine that built it.
      - name: the deb installs and runs
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 sh -euc '
            dpkg -i krtek_*.deb
            krtek --help | head -1
            test -f /usr/share/man/man1/krtek.1.gz
            dpkg -r krtek
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      # The whole history, because the notes below say what changed since the
      # last tag and a shallow clone has neither the tags nor what is between.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The formula names the checksums of the archives that were just built, so
      # it can never point at something that is not there.
      - name: the homebrew formula
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          ./packaging/formula.sh "$version" artifacts > artifacts/krtek.rb
          cat artifacts/krtek.rb

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          # A heredoc, because the notes are prose: quoting them through echo is how
          # a backslash ends up in a release nobody can edit afterwards.
          # What changed, from the commit subjects: they are written as sentences
          # about what happened and why, which is what release notes want, and
          # writing them twice is how the second copy comes to be wrong.
          previous=$(git describe --tags --abbrev=0 "$version^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            {
              echo "### Since $previous"
              echo
              git log --reverse --pretty='- %s' "$previous..$version"
              echo
            } > changes.md
          else
            : > changes.md
          fi

          cat > notes.md <<'NOTES'
          A database manager for the terminal: SQLite, PostgreSQL, MySQL/MariaDB,
          SQL Server, Redis, Kafka, S3, Azure Blob, RabbitMQ, SFTP and Kubernetes,
          behind one interface.

          Every archive holds one binary that **needs nothing installed**. SQLite,
          libpq, the MariaDB connector, libssh2 and OpenSSL are linked into it; Redis,
          Kafka, S3, Azure Blob, RabbitMQ, the Kubernetes API and SQL Server's TDS are
          spoken directly, protocol and all - down to the WebSocket a shell in a
          container needs, so no kubectl either.

          The Linux binaries are static against musl and run on any distribution. The
          macOS ones leave only Apple's own libraries dynamic. Both are built for a
          baseline CPU, so they run on any processor of their architecture.

          ```sh
          brew install zales/krtek/krtek                # macOS and Linux
          sudo apt install krtek                        # Debian, Ubuntu - see below
          tar xzf krtek-*.tar.gz && ./krtek-*/krtek     # anywhere else
          ```

          The APT repository is signed, so apt checks it the way it checks Debian's own:

          ```sh
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSLo /etc/apt/keyrings/krtek.gpg \
            https://zales.github.io/krtek/krtek-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/krtek.gpg] https://zales.github.io/krtek ./" \
            | sudo tee /etc/apt/sources.list.d/krtek.list
          sudo apt update && sudo apt install krtek
          ```
          NOTES
          # The indentation above is the workflow's; strip it from the file.
          sed -i 's/^          //' notes.md
          cat changes.md notes.md > release.md && mv release.md notes.md
          # Runnable twice. A release that already exists is edited rather than
          # refused, so a version can be built again when only the packaging
          # around it changed and the binaries are the same ones.
          if gh release view "$version" >/dev/null 2>&1; then
            gh release edit "$version" --title "krtek $version" --notes-file notes.md
            gh release upload "$version" --clobber \
              artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
              artifacts/*.deb artifacts/*.deb.sha256 \
              artifacts/krtek.rb
          else
            gh release create "$version" \
              --title "krtek $version" \
              --notes-file notes.md \
              artifacts/*.tar.gz artifacts/*.tar.gz.sha256 \
              artifacts/*.deb artifacts/*.deb.sha256 \
              artifacts/krtek.rb
          fi

      # The tap picks the formula up from this release on its own - see the
      # comment in packaging/formula.sh. It is written a second time by the
      # `formula` job below, once there are bottles to name in it.

  # Bottles, and not for speed. Homebrew runs its build-from-source checks on any
  # formula it cannot pour, and one of those refuses to install anything at all
  # when the machine's Xcode is older than its macOS - which happens to everybody
  # running a beta macOS before the matching Xcode ships. This formula compiles
  # nothing, so that check is answering a question nobody asked, and a bottle is
  # the only way left to say so: `bottle :unneeded` was removed from Homebrew.
  #
  # One bottle per architecture is enough, because Homebrew falls back to a bottle
  # built for an older macOS when there is none for the running one -
  # `find_older_compatible_tag`. So these do not need rebuilding every September.
  #
  # macOS only, deliberately. The check being answered here is a macOS one, and
  # Homebrew on Linux would rather build from source than be handed a bottle from
  # a runner image nobody controls. Linux has the APT repository anyway.
  bottles:
    name: bottle-${{ matrix.runner }}
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - name: the formula this release just published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          gh release download "$version" --repo "$GITHUB_REPOSITORY" --pattern krtek.rb --dir .

      - name: build the bottle
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          # Homebrew will not load a formula that is not in a tap, so it gets one
          # of its own. Which tap it is built in has nothing to do with the tap it
          # will be poured from: a bottle is named for the formula and its
          # version, and nothing else.
          brew tap-new krtek/bottling
          cp krtek.rb "$(brew --repository krtek/bottling)/Formula/krtek.rb"
          # Newer Homebrew will not load a formula from a tap nobody has vouched
          # for; older Homebrew has no such command and does not need one.
          brew trust --tap krtek/bottling || true
          brew install --build-bottle krtek/bottling/krtek
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$version" \
            krtek/bottling/krtek
          ls -l ./*.bottle.*

      # `brew bottle` writes the file under its cache name, which doubles the dash
      # so it can sit next to a source tarball of the same version without one
      # overwriting the other. The name Homebrew later asks the root_url for is the
      # other one in the JSON, and uploading under the cache name is a 404.
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          python3 - <<'PY'
          import glob, json, os
          for path in glob.glob("*.bottle.json"):
              with open(path) as f:
                  root = json.load(f)
              for formula in root.values():
                  for said in formula.get("bottle", {}).get("tags", {}).values():
                      if said["local_filename"] != said["filename"]:
                          os.replace(said["local_filename"], said["filename"])
                          print(said["local_filename"], "->", said["filename"])
          PY
          gh release upload "$version" --repo "$GITHUB_REPOSITORY" --clobber ./*.bottle.tar.gz

      # The JSON says which tag and which checksum, which is what the formula has
      # to name; the tarball is already on the release for Homebrew to fetch.
      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.runner }}
          path: "*.bottle.json"

  # And the formula again, this time naming the bottles. Written over the one the
  # release already has, because the tap fetches whatever is attached: until this
  # runs, an install still works and simply builds from source.
  formula:
    needs: bottles
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: bottles
          pattern: bottle-*
          merge-multiple: true

      - name: the formula, with the bottles in it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          # The archive checksums it also names, from the release itself.
          gh release download "$version" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz.sha256' --dir bottles
          ./packaging/formula.sh "$version" bottles > krtek.rb
          cat krtek.rb
          gh release upload "$version" --repo "$GITHUB_REPOSITORY" --clobber krtek.rb

  # And the APT repository on GitHub Pages, from the .deb files the release just
  # attached. Called, not triggered: see the comment at the top of apt.yml.
  apt:
    needs: release
    uses: ./.github/workflows/apt.yml
    secrets: inherit
    permissions:
      contents: write
