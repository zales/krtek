name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # macOS links the client libraries out of Homebrew and leaves only the system's
  # own dylibs behind, so it builds on the runner itself.
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide what the others did.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      # The keg-only libraries keep their .pc files to themselves.
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3
      - run: ./fetch-sqlite.sh

      - name: build
        run: |
          zig build -Doptimize=ReleaseSafe -Dstatic \
            -Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)

      # Nothing of the client libraries may be left as a runtime dependency: that
      # is the whole point of -Dstatic, and it is easy to lose by accident.
      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          ! grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt

      - name: test
        run: zig build test -Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)

      - name: it runs
        run: ./tests/smoke.sh

  # Linux links the client libraries dynamically: Debian's libpq.a is missing the
  # pgcommon and pgport archives it needs, so -Dstatic cannot work with the
  # distribution's own packages, and a binary built there wants libpq5 and
  # libmariadb3 installed.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpq-dev libmariadb-dev

      - run: ./fetch-sqlite.sh
      - run: zig build -Doptimize=ReleaseSafe
      - run: zig build test
      - run: ./tests/smoke.sh
      - run: ldd zig-out/bin/krtek
