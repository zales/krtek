name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # macOS links the client libraries out of Homebrew and leaves only the system's
  # own dylibs behind, so it builds on the runner itself. All but the MariaDB
  # connector, which is built from source as it is for Linux: Homebrew's archive
  # keeps the ways of logging in as plugins in a directory of its own.
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide what the others did.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      # The keg-only libraries keep their .pc files to themselves. The connector
      # the binary links is the one built below, so its .pc comes first.
      PKG_CONFIG_PATH: /tmp/mariadb-static/lib/pkgconfig:/opt/homebrew/opt/libpq/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # One way of writing it, decided by the compiler rather than by whoever
      # touched the file last. Before this the repository was tab-indented by
      # habit, nothing checked it, and three files written in one afternoon came
      # out with spaces - which nobody noticed until a `sed` range stopped
      # matching. Vendored C is not Zig's to format.
      - name: written the way zig writes it
        run: zig fmt --check src/ tests/ build.zig

      # Homebrew's connector is still installed: the tests and the fuzzer below
      # are not static, and its shared library is what they link.
      - run: brew install pkgconf cmake libpq mariadb-connector-c openssl@3 libssh2
      - run: ./fetch-sqlite.sh

      # What the release does, for the reason given there: an archive of the
      # connector that can log in to MySQL 8 without a directory of plugins.
      - name: the connector, with the ways of logging in inside it
        run: ./tests/connector.sh

      # -Dcpu=baseline for the same reason as in the release: a binary tuned to
      # the runner's CPU dies with an illegal instruction on anybody else's.
      - name: build
        run: |
          zig build -Doptimize=safe -Dstatic -Dcpu=baseline \
            -Dlibpq="$(brew --prefix libpq)" -Dmariadb=/tmp/mariadb-static

      # Nothing of the client libraries may be left as a runtime dependency: that
      # is the whole point of -Dstatic, and it is easy to lose by accident.
      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          if grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt; then
            echo "::error::a client library is still a runtime dependency"; exit 1
          fi

      # A plugin left outside is a runtime dependency as well, and one that otool
      # does not list. There is no server on a macOS runner to log in to, so the
      # binary is asked for their names - which it only has when they are in it.
      - name: and the ways of logging in are inside it
        run: |
          for plugin in caching_sha2_password sha256_password client_ed25519; do
            strings -a zig-out/bin/krtek | grep -cx "$plugin" || {
              echo "::error::$plugin would be loaded from a directory nobody else has"; exit 1
            }
          done

      - name: test
        run: zig build test -Dlibpq="$(brew --prefix libpq)" -Dmariadb="$(brew --prefix mariadb-connector-c)"

      - name: it runs
        run: ./tests/smoke.sh

      # The file layer talks to libc, and libc is where the platforms disagree.
      # Cheap enough to run on the machine that builds first, so a break shows up
      # here rather than in the Linux job twenty minutes later.
      - name: the file layer compiles for every platform
        run: ./tests/platforms.sh

      # Malformed bytes at the protocol parsers. A fixed seed, so this is a
      # regression check rather than a lottery: whatever it found once, it finds
      # again. `zig build fuzz -- 2000000 <seed>` is the long version, by hand.
      - name: the parsers survive malformed input
        run: zig build fuzz -Doptimize=safe -Dlibpq="$(brew --prefix libpq)" -Dmariadb="$(brew --prefix mariadb-connector-c)" -- 150000

  # Linux is built static against musl inside an Alpine container, which gets one
  # binary that runs on any distribution - verified on Debian, with nothing
  # installed. It cannot be done on the runner itself: Debian's libpq.a is missing
  # the pgcommon and pgport archives it needs, and Alpine, which has those, ships
  # no archive for the MariaDB connector - so that one is built from source, which
  # is what tests/linux-static.sh does.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: build static, in alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -euc '
            apk add --no-cache build-base cmake pkgconf python3 curl tar xz \
              postgresql-dev openssl-dev openssl-libs-static zlib-static \
              libssh2-dev libssh2-static >/dev/null
            curl -fsSL "https://ziglang.org/download/0.17.0/zig-$(uname -m)-linux-0.17.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig && tar xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            export PATH=/opt/zig:$PATH ZIG_GLOBAL_CACHE_DIR=/tmp/zig-cache
            ./fetch-sqlite.sh
            TEST=1 OPTIMIZE=safe ./tests/linux-static.sh -Dcpu=baseline
            ./tests/smoke.sh
          '

      # Static all the way down: this is the whole point of the Alpine detour, and
      # a shared library sneaking back in would not be noticed otherwise.
      - name: it needs nothing at all
        run: |
          file zig-out/bin/krtek | tee links.txt
          grep -q "statically linked" links.txt

      # A check that -Dcpu=baseline is still there, since losing one word would
      # not be noticed until somebody else's machine died on it: run the binary on
      # an emulated processor without what this runner happens to have - qemu64 has
      # no AVX, cortex-a72 no SVE.
      #
      # Behavioural on purpose. Grepping the disassembly for those instructions
      # does not work: OpenSSL carries AVX-512 routines and picks them by CPUID at
      # runtime, which is safe and would fail the grep. Running it is the question
      # actually worth asking.
      - name: it runs on a CPU without the runner's extras
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          case "${{ matrix.arch }}" in
            x86_64) qemu-x86_64 -cpu qemu64 zig-out/bin/krtek --help ;;
            arm64) qemu-aarch64 -cpu cortex-a72 zig-out/bin/krtek --help ;;
            *) echo "::error::no baseline CPU known for ${{ matrix.arch }}"; exit 1 ;;
          esac

      - name: and on a distribution that is not Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12 ./zig-out/bin/krtek --help | head -2

      # The .deb is built by the release, so build one here too: a tag should not
      # be the first time anybody finds out that it does not install.
      - name: the deb builds, installs and runs
        run: |
          sudo chown -R "$(id -u):$(id -g)" zig-out
          arch=${{ matrix.arch }}
          ./packaging/deb.sh 0.0.0 "${arch/x86_64/amd64}"
          docker run --rm -v "$PWD:/src" -w /src debian:12 sh -euc '
            dpkg -i krtek_*.deb
            krtek --help | head -1
            test -f /usr/share/man/man1/krtek.1.gz
            dpkg -r krtek
          '
