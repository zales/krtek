name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # macOS links the client libraries out of Homebrew and leaves only the system's
  # own dylibs behind, so it builds on the runner itself.
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide what the others did.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      # The keg-only libraries keep their .pc files to themselves.
      PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - run: brew install pkgconf libpq mariadb-connector-c openssl@3
      - run: ./fetch-sqlite.sh

      - name: build
        run: |
          zig build -Doptimize=ReleaseSafe -Dstatic \
            -Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)

      # Nothing of the client libraries may be left as a runtime dependency: that
      # is the whole point of -Dstatic, and it is easy to lose by accident.
      - name: nothing but the system is linked
        run: |
          otool -L zig-out/bin/krtek | tee links.txt
          ! grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt

      - name: test
        run: zig build test -Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)

      - name: it runs
        run: ./tests/smoke.sh

  # Linux is built against musl in an Alpine chroot, which gets one binary that
  # runs on any distribution. Debian's `libpq.a` is missing the pgcommon and
  # pgport archives that it needs, so a static build there is not possible with
  # the distribution's own packages; Alpine's postgresql-dev has all of it.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: jirutka/setup-alpine@v1
        with:
          branch: v3.22
          packages: >
            build-base pkgconf python3 curl tar xz
            postgresql-dev mariadb-connector-c-dev
            openssl-dev openssl-libs-static zlib-static
            krb5-dev openldap-dev curl-dev curl-static

      - name: zig
        shell: alpine.sh {0}
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-$arch-linux-0.16.0.tar.xz" -o zig.tar.xz
          mkdir -p /opt/zig && tar xJf zig.tar.xz -C /opt/zig --strip-components=1
          /opt/zig/zig version

      - name: build, test, run
        shell: alpine.sh {0}
        run: |
          export PATH=/opt/zig:$PATH
          ./fetch-sqlite.sh
          zig build -Doptimize=ReleaseSafe -Dstatic
          zig build test
          ./tests/smoke.sh

      - name: it needs nothing at all
        shell: alpine.sh {0}
        run: |
          file zig-out/bin/krtek
          ldd zig-out/bin/krtek 2>&1 | tee links.txt || true
          grep -qE "statically linked|not a dynamic executable|Not a valid dynamic" links.txt
