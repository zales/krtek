name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not hide what the others did.
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            runner: ubuntu-24.04
          - name: linux arm64
            runner: ubuntu-24.04-arm
          - name: macos arm64
            runner: macos-15
          - name: macos x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The two client libraries krtek links: libpq for PostgreSQL, the MariaDB
      # connector for MySQL. SQLite is compiled in and Redis needs nothing.
      - name: client libraries (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpq-dev libmariadb-dev libssl-dev \
            libkrb5-dev libldap2-dev zlib1g-dev libcurl4-openssl-dev

      - name: client libraries (macos)
        if: runner.os == 'macOS'
        run: brew install pkgconf libpq mariadb-connector-c openssl@3

      - name: what the client libraries actually ship
        run: |
          echo "--- pkg-config libpq:";     pkg-config --static --libs libpq || true
          echo "--- pkg-config libmariadb:"; pkg-config --static --libs libmariadb || true
          echo "--- archives on disk:"
          ls -1 /usr/lib/*/libpq*.a /usr/lib/*/libpg*.a /usr/lib/*/libmariadb*.a 2>/dev/null || true
          ls -1 $(brew --prefix libpq 2>/dev/null)/lib/*.a 2>/dev/null || true
          echo "--- which package has libpgcommon:"
          apt-file search libpgcommon.a 2>/dev/null | head -3 || true

      - name: the SQLite amalgamation
        run: ./fetch-sqlite.sh

      - name: build
        env:
          # The keg-only libraries keep their .pc files to themselves.
          PKG_CONFIG_PATH: /opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/mariadb-connector-c/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/mariadb-connector-c/lib/pkgconfig
        run: |
          zig build -Doptimize=ReleaseSafe -Dstatic \
            ${{ runner.os == 'macOS' && '-Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)' || '' }}

      # Nothing of the client libraries may be left as a runtime dependency: that
      # is the whole point of -Dstatic, and it is easy to lose by accident.
      - name: nothing but the system is linked
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L zig-out/bin/krtek | tee links.txt
            ! grep -qE "libpq|mariadb|libssl|libcrypto|homebrew|/usr/local" links.txt
          else
            ldd zig-out/bin/krtek | tee links.txt
            ! grep -qE "libpq|mariadb|libssl|libcrypto" links.txt
          fi

      - name: test
        run: |
          zig build test \
            ${{ runner.os == 'macOS' && '-Dlibpq=$(brew --prefix libpq) -Dmariadb=$(brew --prefix mariadb-connector-c)' || '' }}

      # It has to start, find its terminal and draw something. The harness feeds
      # it keys through a pty and reads back what it drew, so this catches a
      # binary that builds and then falls over on the first frame.
      - name: it runs
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect("ci.db")
          c.execute("create table notes (id integer primary key, body text)")
          c.execute("insert into notes (body) values ('from ci')")
          c.commit()
          PY
          python3 tests/screen.py ci.db '{keep}' | tee screen.txt
          grep -q "from ci" screen.txt

      - name: what the object list looked like
        if: always()
        run: cat screen.txt || true
