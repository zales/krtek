<text x="39.2" y="171.3" fill="#7c7c88" font-style="italic" xml:space="preserve" textLength="571.2" lengthAdjust="spacing">goes in the path there. The secret key is the password below, and an</text>
<text x="837.2" y="171.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="22.4" y="189.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="39.2" y="189.3" fill="#7c7c88" font-style="italic" xml:space="preserve" textLength="554.4" lengthAdjust="spacing">empty access key means ~/.aws and AWS_ACCESS_KEY_ID are looked at.</text>
<text x="837.2" y="189.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="22.4" y="207.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="39.2" y="207.3" fill="#9a9aa6" xml:space="preserve" textLength="142.8" lengthAdjust="spacing">keep the password</text>
<text x="198.8" y="207.3" fill="#e0e0e6" xml:space="preserve" textLength="84.0" lengthAdjust="spacing">‹ask     ›</text>
<text x="299.6" y="207.3" fill="#9a9aa6" xml:space="preserve" textLength="67.2" lengthAdjust="spacing">password</text>
<rect x="375.2" y="209.7" width="201.6" height="1.1" fill="#7c7c88"/>
<text x="837.2" y="207.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="22.4" y="225.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="39.2" y="225.3" fill="#7c7c88" font-style="italic" xml:space="preserve" textLength="604.8" lengthAdjust="spacing">file: plain text in ~/.config/krtek/connections, which only you can read</text>
<text x="837.2" y="225.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="22.4" y="243.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
<text x="39.2" y="243.3" fill="#7c7c88" font-style="italic" xml:space="preserve" textLength="588.0" lengthAdjust="spacing">keychain: in the macOS keychain, which asks you before handing it over</text>
<text x="837.2" y="243.3" fill="#8aa7f0" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">│</text>
